name: Performance budgets

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  official-performance:
    name: Performance budgets (official)
    runs-on: ubuntu-latest
    # The frozen 150/300/1000 workload took ~43 minutes to reach browser
    # measurement on GitHub's runner. Keep the samples/budgets fixed and give
    # the orchestration enough room to finish camera and receipt validation.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate frozen performance contract
        run: npm run performance:budgets:check
      - name: Start disposable local Supabase
        run: npx supabase start -x studio,inbucket,imgproxy,edge-runtime,logflare,vector
      - name: Install frozen browser engine
        run: npx playwright install --with-deps chromium
      - name: Install query-plan client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Measure and validate frozen performance budgets
        run: npm run performance:official
      - name: Retain raw measurements and validated receipts
        uses: actions/upload-artifact@v4
        if: always()
        # Non-fatal: no job or step downloads these artifacts, and the org's
        # artifact storage quota is exhausted. Short retention limits storage use.
        continue-on-error: true
        with:
          name: performance-receipts-${{ github.sha }}
          path: |
            test-results/performance/fixture-manifest.json
            test-results/performance/api-raw.json
            test-results/performance/web-vitals.raw.json
            test-results/performance/camera.raw.json
            test-results/performance/javascript.raw.json
            test-results/performance/javascript-discovery/
            test-results/performance/query-plans.json
            test-results/performance/receipts.json
            test-results/performance/validation-result.json
          if-no-files-found: error
          retention-days: 3
