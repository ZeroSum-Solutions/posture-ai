name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run lint:vocab
      - run: npx vitest run
      - run: npm test -w @posture-ai/engine
      - run: npm run build

  e2e:
    name: Playwright e2e (local Supabase stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Start local Supabase (applies migrations)
        run: npx supabase start -x studio,inbucket,imgproxy,edge-runtime,logflare,vector
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run e2e suite
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
